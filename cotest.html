or:#b54708}.done{background:var(--greenbg);color:var(--green)}.progress{background:var(--amberbg);color:var(--amber)}.waiting{background:var(--gray);color:#475467}.pagination{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:13px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.info{background:#f8fafc;border-radius:10px;padding:11px}.info .label,.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.info .value{white-space:pre-wrap;overflow-wrap:anywhere}.span2{grid-column:span 2}.span4{grid-column:span 4}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field textarea{min-height:120px;resize:vertical}.choicebox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;min-height:44px}.field label.choiceitem{display:flex;gap:10px;align-items:flex-start;line-height:1.3;margin-bottom:0;text-transform:none;font-size:13px;font-weight:400;color:var(--text)}.choiceitem input{width:auto!important;min-height:0!important;margin:2px 0 0}.qualification-title{margin:18px 0 10px;font-size:15px}.treatment-date{font-size:12px;color:var(--muted);margin-top:8px}.etab-link{border:0;background:none;padding:0;color:var(--text);cursor:pointer;text-align:left;font-weight:400}.etab-link:hover{text-decoration:underline}.open-btn{color:var(--text)!important;background:#fff!important}.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}.event{position:relative;padding:0 0 17px}.event:before{content:"";position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--blue)}.event.old-school-year:before{background:#14532d}.event-title{font-weight:700}.level-warning{display:inline-flex;align-items: <!-- CO-EMAS V27 — fallback FE26_27 vers SUIVI pour statut/équipier/suivi -->
<script>
"use strict";
const T={CUR:"FE26_27_2",OLD:"FE25_26",SUIVI:"SUIVI_FE26_27",EQ:"EQUIPIERS",ETAB:"ETABLISSEMENTS",ACT_D1:"ACTIVITE_D1_EMS34_48",ACT_D2:"ACTIVITE_D2_EMS34_48"};
const PAGE=25; let tokenInfo=null,currentRows=[],rows=[],suiviMap=new Map(),eqMap=new Map(),etabMap=new Map(),page=1,selected=null,selectedSuivi=null,selectedEtab=null;
const $=id=>document.getElementById(id); grist.ready({requiredAccess:"full"});
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
function date(v){if(!v)return null;if(typeof v==="number")return new Date(v*1000);let d=new Date(v);return isNaN(d)?null:d}
function dateFR(v){let d=date(v);return d?new Intl.DateTimeFormat("fr-FR").format(d):"—"}
function notice(s,type=""){let n=$("notice");if(!n)return;n.textContent=s;n.className="notice"+(type?" "+type:"")}
async function getTokenInfo(force=false){
  const now=Date.now();
  if(!force && tokenInfo && tokenInfo._expiresAt && now < tokenInfo._expiresAt-30000)return tokenInfo;
  const t=await grist.docApi.getAccessToken({readOnly:false});
  tokenInfo={...t,_expiresAt:now+(t.ttlMsecs||240000)};
  return tokenInfo;
}
function restRecordsToRows(payload,source){
  const records=Array.isArray(payload?.records)?payload.records:[];
  return records.map(r=>({id:r.id,_source:source,...(r.fields||{})}));
}
async function gristGet(path,params=null,retry=true){
  const t=await getTokenInfo(false);
  const qs=new URLSearchParams(params||{});
  qs.set("auth",t.token);
  const url=t.baseUrl+path+(qs.size?"?"+qs.toString():"");
  const response=await fetch(url,{method:"GET",credentials:"omit"});
  if(response.status===401&&retry){tokenInfo=null;await getTokenInfo(true);return gristGet(path,params,false)}
  if(!response.ok){const detail=await response.text().catch(()=>response.statusText);throw new Error("HTTP "+response.status+" — "+detail.slice(0,240))}
  return response.json();
}
async function api(table,{filter=null,sort=null,limit=null,offset=null}={}){
  try{
    const params={cellFormat:"normal"};
    if(filter)params.filter=JSON.stringify(filter);
    if(sort)params.sort=sort;
    if(limit!=null)params.limit=String(limit);
    if(offset!=null)params.offset=String(offset);
    const payload=await gristGet("/tables/"+encodeURIComponent(table)+"/records",params);
    return restRecordsToRows(payload,table);
  }catch(e){
    const detail=(e&&e.message)?e.message:String(e);
    throw new Error("Table "+table+" : "+detail);
  }
}
async function apiAllPaged(table,{filter=null,sort=null,pageSize=2000,maxRows=50000}={}){
  const out=[];
  for(let offset=0;offset<maxRows;offset+=pageSize){
    const batch=await api(table,{filter,sort,limit:pageSize,offset});
    out.push(...batch);
    if(batch.length<pageSize)break;
  }
  return out;
}
function dateTimeFR(v){let d=date(v);return d?new Intl.DateTimeFormat("fr-FR",{dateStyle:"short",timeStyle:"short"}).format(d):"—"}
function eqName(v){
  if(v===null||v===undefined||String(v).trim()==="")return "N/A";
  const byId=eqMap.get(Number(v));
  if(byId)return byId.Nom||byId.Email||("Équipier #"+v);
  const nv=norm(v);
  const byName=[...eqMap.values()].find(e=>norm(e.Nom)===nv||norm(e.Email)===nv);
  return byName?.Nom||String(v);
}
function equipierRef(v){
  if(v===null||v===undefined||String(v).trim()==="")return null;
  if(eqMap.has(Number(v)))return Number(v);
  const nv=norm(v);
  const found=[...eqMap.values()].find(e=>norm(e.Nom)===nv||norm(e.Email)===nv);
  return found?.id??null;
}
function etabUai(ref){return etabMap.get(Number(ref))?.UAI||""}
function sourceStatus(f){
  const raw=String(f?.Statut||"").trim();
  if(!raw)return "Non attribué";
  const n=norm(raw);
  if(n.includes("termine")||n.includes("cloture"))return "Terminé";
  if(n.includes("cours")||n.includes("attrib"))return "En cours";
  return raw;
}
function statusOf(f){
  let s=suiviMap.get(Number(f.Numero_FE));
  return f._source===T.OLD?"Terminé":(s?.Statut||sourceStatus(f));
}
function sourceSuivi(f){
  if(!f||f._source===T.OLD)return {};
  return {
    Equipier:equipierRef(f.Equipier),
    Statut:sourceStatus(f),
    Suivi_etablissement:f.Suivi_etablissement||"",
    Accompagnement_EMAS:f.Accompagnement_EMAS||"",
    Notes_informations:f.Notes_informations||"",
    Date_traitement_EMS:f.Date_traitement_EMS||null
  };
}
function badgeStatus(s){let c=s==="Terminé"?"done":s==="En cours"?"progress":"waiting",label=(!s||s==="Non attribué")?"N/A":s;return `<span class="badge ${c} status-badge">${esc(label)}</span>`}
function factTypeBadges(v,level){
  const t=norm(v); if(!t)return '<span class="muted">—</span>'; const out=[]; const add=x=>{if(!out.includes(x))out.push(x)};
  if(t.includes("valeur")&&t.includes("republique")||t.includes("valrep"))add("ValRep");
  if(t.includes("harcel"))add("Harcel");
  if(t.includes("atteinte")&&t.includes("bien"))add("AttBiens");
  if(t.includes("securite")||t.includes("climat scolaire"))add("AttSecu");
  const vp=t.includes("violence physique"), vv=t.includes("violence verbale")||t.includes("menace orale"), vs=t.includes("violence sexuelle");
  if(vp||vv||vs){let x=[];if(vp)x.push("VP");if(vs)x.push("VS");if(vv)x.push("VV");add("AttPers: "+x.join(" + "))}
  else if(t.includes("atteinte")&&t.includes("personne"))add("AttPers");
  if(!out.length)add(String(v).split(/[;,]/)[0].trim().slice(0,24)||"Autre");
  return '<div class="type-badges">'+out.map(x=>`<span class="type-badge ${String(level)==="3"?"level3":""}">${esc(x)}</span>`).join("")+'</div>'
}
function structuredTypeBadges(v){
  if(v===null||v===undefined||String(v).trim()==="")return '<span class="muted">—</span>';
  let raw=String(v).trim();
  // Grist ChoiceList peut arriver sous la forme ["L", ...].
  let items=[];
  try{
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed))items=parsed.filter((x,i)=>!(i===0&&x==="L")).map(String);
  }catch(_){ }
  if(!items.length){
    // Les chemins structurés sont normalement séparés par retours à la ligne / ; / ||.
    items=raw.split(/\r?\n|\s*\|+\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean);
  }
  const groups=[];
  for(const item of items){
    const clean=item.replace(/^[-•]\s*/,"").trim();
    if(!clean)continue;
    const root=clean.split(/\s*>\s*/)[0].trim();
    let g=groups.find(x=>x.root===root);
    if(!g){g={root,items:[]};groups.push(g)}
    if(!g.items.includes(clean))g.items.push(clean);
  }
  return '<div class="structured-types">'+groups.map(g=>'<div class="structured-type-group">'+g.items.map(x=>`<span class="structured-type-badge">${esc(x)}</span>`).join('')+'</div>').join('')+'</div>';
}
function equipierBadge(name){let n=String(name||"N/A");let empty=!name||n==="Non attribué"||n==="N/A";if(empty)n="N/A";return `<span class="equipier-badge ${empty?"unassigned":""}">${esc(n)}</span>`}
function schoolYearBounds(now=new Date()){
  const y=now.getFullYear(),m=now.getMonth();
  const startYear=m>=8?y:y-1;
  return {start:new Date(startYear,8,1,0,0,0),end:new Date(startYear+1,7,31,23,59,59),label:`${startYear}-${startYear+1}`};

function choiceValues(v){
  if(v===null||v===undefined||v==="")return[];
  if(Array.isArray(v))return (v[0]==="L"?v.slice(1):v).map(x=>String(x).trim()).filter(Boolean);
  let raw=String(v).trim();
  // Selon le chemin de lecture Grist, une Choice List peut revenir sous forme
  // de tableau réel, de JSON texte ["L",...], ou de représentation ['...', '...'].
  try{
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed))return (parsed[0]==="L"?parsed.slice(1):parsed).map(x=>String(x).trim()).filter(Boolean);
  }catch(_){ }
  if(/^\[.*\]$/.test(raw)){
    let inner=raw.slice(1,-1).trim();
    if(!inner)return[];
    let vals=inner.split(/\s*,\s*/).map(x=>x.trim().replace(/^['\"]|['\"]$/g,"")).filter(Boolean);
    if(vals[0]==="L")vals.shift();
    return vals;
  }
  return [raw];
}

    [["Delai","Délai"],activityDelay(f.Date_de_saisie,s.Date_traitement_EMS)],
    [["Equipier","Équipier"],s.Equipier||null],
    [["Securisation","Sécurisation"],gristChoiceList(getChoiceBox("Securisation"))],
    [["Prevention","Prévention"],gristChoiceList(getChoiceBox("Prevention"))],
    [["Accompagnement"],gristChoiceList(getChoiceBox("Accompagnement"))],
    [["Formation"],gristChoiceList(getChoiceBox("Formation"))],
    [["Representation_Partenariat","Représentation Partenariat","Representation Partenariat"],gristChoiceList(getChoiceBox("Representation_Partenariat"))]
  ];
  const fields={};
  for(const [aliases,value] of values){const col=activityCol(cols,...aliases);if(col)fields[col]=value}
  if(existing.length>1)throw new Error(`Doublon détecté dans ${table} pour le FE ${numero}. Synchronisation bloquée.`);
  if(existing.length){
    await grist.docApi.applyUserActions([["UpdateRecord",table,existing[0].id,fields]]);
  }else{
    // Relecture juste avant création pour réduire le risque de doublon en accès simultané.
    const recheck=await api(table,{filter:{[keyCol]:[numero,String(numero)]},limit:2});
    if(recheck.length){await grist.docApi.applyUserActions([["UpdateRecord",table,recheck[0].id,fields]]);return;}
    fields[keyCol]=numero;
    await grist.docApi.applyUserActions([["AddRecord",table,null,fields]]);
  }
}
function showModal({title="Information",message="",type="",confirmText="OK",cancelText=null}={}){
  return new Promise(resolve=>{
    const modal=$("appModal"),box=$("appModalBox"),actions=$("appModalActions");
    $("appModalTitle").textContent=title;$("appModalMessage").textContent=message;
    box.className="modal-box"+(type?" "+type:"");actions.innerHTML="";
    if(cancelText){const cancel=document.createElement("button");cancel.className="btn";cancel.textContent=cancelText;cancel.onclick=()=>{modal.classList.add("hidden");resolve(false)};actions.appendChild(cancel)}
    const ok=document.createElement("button");ok.className="btn "+(type==="error"?"danger-outline":"primary");ok.textContent=confirmText;ok.onclick=()=>{modal.classList.add("hidden");resolve(true)};actions.appendChild(ok);
    modal.classList.remove("hidden");ok.focus();
  });
}
async function removeActivityForFact(f){
  const table=degreeActivityTable(f);if(!table)return 0;
  const cols=await activityColumns(table);const keyCol=activityCol(cols,"Nmr_FE_ou_Initiative","Nmr FE ou Initiative","N° FE ou Initiative","Numero_FE","Numéro FE");
  if(!keyCol)throw new Error("Colonne numéro FE introuvable dans "+table+".");

}

  if(!selected||selected._source===T.OLD)return;

  const ok=await showModal({title:"Remettre le suivi à zéro ?",message:`Le suivi du FE ${numero} sera supprimé de SUIVI_FE26_27 et sa ligne sera retirée du tableau Activité D1/D2.\n\nLe fait d’établissement d’origine ne sera pas supprimé.`,type:"error",confirmText:"Remettre à zéro",cancelText:"Annuler"});
  if(!ok)return;

    const suivis=await api(T.SUIVI,{filter:{Numero_FE:[numero]},limit:50});

  }catch(e){await showModal({title:"Réinitialisation impossible",message:e.message,type:"error"})}

async function persistOps(forcedStatus=null){
  if(!selected||selected._source===T.OLD)return;
  const numero=Number(selected.Numero_FE);
  let eq=$("equipier").value?Number($("equipier").value):null;
  let st=forcedStatus||$("editStatus").value;if(!forcedStatus&&st!=="Terminé")st="En cours";
  let now=Math.floor(Date.now()/1000);
  await ensureChoiceListColumns(T.SUIVI);
  let fields={Equipier:eq,Statut:st,Suivi_etablissement:$("suivi").value.trim(),Accompagnement_EMAS:$("emas").value.trim(),Notes_informations:$("notes").value.trim(),Eleve_suivi:$("eleveSuivi").value.trim(),Securisation:gristChoiceList(getChoiceBox("Securisation")),Prevention:gristChoiceList(getChoiceBox("Prevention")),Accompagnement:gristChoiceList(getChoiceBox("Accompagnement")),Formation:gristChoiceList(getChoiceBox("Formation")),Representation_Partenariat:gristChoiceList(getChoiceBox("Representation_Partenariat")),Derniere_modification:now};
  $("save").disabled=true;$("toggleDone").disabled=true;
  let suiviSaved=false;
  try{
    // Concurrence optimiste : relire le suivi avant toute écriture.
    const live=await api(T.SUIVI,{filter:{Numero_FE:[numero]},limit:3});
    if(live.length>1)throw new Error(`Doublon SUIVI détecté pour le FE ${numero}. Enregistrement bloqué.`);
    const liveRow=live[0]||null;
    if(selectedSuivi&&liveRow){
      const opened=Number(selectedSuivi.Derniere_modification||0),current=Number(liveRow.Derniere_modification||0);
      if(opened&&current&&opened!==current){
        const who=liveRow.Modifie_par?` par ${liveRow.Modifie_par}`:" par un autre utilisateur";const when=liveRow.Derniere_modification?` le ${dateTimeFR(liveRow.Derniere_modification)}`:"";throw new Error(`Ce FE a été modifié${who}${when} depuis son ouverture. Rechargez la fiche avant d’enregistrer.`);
      }
    }
    if(!liveRow){
      fields.Numero_FE=numero;
      fields.Date_traitement_EMS=now;
      // Dernière relecture avant AddRecord pour limiter une double création simultanée.
      const recheck=await api(T.SUIVI,{filter:{Numero_FE:[numero]},limit:2});
      if(recheck.length)throw new Error("Ce FE vient d’être pris en charge par un autre utilisateur. Rechargez la fiche.");
      await grist.docApi.applyUserActions([["AddRecord",T.SUIVI,null,fields]]);
    }else{
      if(!liveRow.Date_traitement_EMS)fields.Date_traitement_EMS=now;
      await grist.docApi.applyUserActions([["UpdateRecord",T.SUIVI,liveRow.id,fields]]);
    }
    suiviSaved=true;
    await loadSingleSuivi(selected);
    try{
      await syncActivity(selected,selectedSuivi);
    }catch(syncErr){
      renderOps();$("detailStatus").innerHTML=badgeStatus(statusOf(selected));render();
      await showModal({title:"Synchronisation Activité incomplète",message:"Le suivi du FE a bien été enregistré, mais la synchronisation du tableau Activité a échoué : "+syncErr.message+"\n\nLa synchronisation est automatique : après correction, le prochain enregistrement remettra à jour la même ligne Activité.",type:"error"});
      return;
    }
    renderOps();$("detailStatus").innerHTML=badgeStatus(statusOf(selected));render();
  }catch(e){
    await showModal({title:suiviSaved?"Synchronisation incomplète":"Enregistrement impossible",message:e.message,type:"error"});
  }finally{$("save").disabled=false;$("toggleDone").disabled=false}
}

ta-hist]").forEach(b=>b.onclick=()=>openFact(b.dataset.hist))}catch(e){$("history").innerHTML='<div class="notice error">Impossible de charger l’historique : '+esc(e.message)+'</div>'}}
