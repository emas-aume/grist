<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test Grist - FELIGNES</title>

  <!-- API officielle des widgets Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 30px;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    #diagnostic {
      padding: 15px;
      margin: 20px 0;
      background: #f3f4f6;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .success {
      background: #ecfdf3 !important;
      color: #067647;
    }

    .error {
      background: #fef3f2 !important;
      color: #b42318;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Test FELIGNES</h1>

    <p>
      Test de connexion entre le widget personnalisé et Grist.
    </p>

    <div id="diagnostic">
      Étape 1 : HTML chargé.
    </div>

    <div id="table-container"></div>

  </div>


  <script>

    const diagnostic = document.getElementById("diagnostic");
    const tableContainer = document.getElementById("table-container");


    /*
     * ÉTAPE 1
     * Vérifier que l'API Grist existe
     */

    if (typeof grist === "undefined") {

      diagnostic.textContent =
        "ERREUR : l'API Grist n'a pas été chargée.";

      diagnostic.className = "error";

    } else {

      diagnostic.textContent =
        "Étape 2 : API Grist chargée. Attente des données...";


      /*
       * ÉTAPE 2
       * Déclarer le widget auprès de Grist
       */

      grist.ready({
        requiredAccess: "read table"
      });


      /*
       * ÉTAPE 3
       * Recevoir les lignes de la table
       * sélectionnée dans le widget Grist
       */

      grist.onRecords(function(records) {

        console.log("Données reçues :", records);

        if (!records) {

          diagnostic.textContent =
            "ERREUR : Grist n'a retourné aucune donnée.";

          diagnostic.className = "error";

          return;
        }


        if (records.length === 0) {

          diagnostic.textContent =
            "Connexion Grist réussie, mais 0 ligne reçue.";

          diagnostic.className = "error";

          return;
        }


        /*
         * ÉTAPE 4
         * Afficher les IDs des colonnes reçues
         */

        const columns = Object.keys(records[0]);

        diagnostic.textContent =
          "CONNEXION RÉUSSIE !\n\n" +
          records.length +
          " lignes reçues.\n\n" +
          "IDs des colonnes reçues :\n" +
          columns.join("\n");

        diagnostic.className = "success";


        /*
         * ÉTAPE 5
         * Créer automatiquement un tableau
         * avec TOUTES les colonnes reçues.
         *
         * On ne renseigne volontairement aucun
         * ID de colonne manuellement pour le test.
         */

        let html = "<table>";

        html += "<thead><tr>";

        columns.forEach(function(column) {

          html += "<th>" +
            escapeHtml(column) +
            "</th>";

        });

        html += "</tr></thead>";


        html += "<tbody>";


        records.slice(0, 20).forEach(function(record) {

          html += "<tr>";

          columns.forEach(function(column) {

            html += "<td>" +
              escapeHtml(formatValue(record[column])) +
              "</td>";

          });

          html += "</tr>";

        });


        html += "</tbody>";
        html += "</table>";


        tableContainer.innerHTML = html;

      });

    }


    /*
     * Fonctions utilitaires
     */

    function formatValue(value) {

      if (value === null || value === undefined) {
        return "";
      }

      if (Array.isArray(value)) {
        return value.join(", ");
      }

      if (typeof value === "object") {
        return JSON.stringify(value);
      }

      return String(value);
    }


    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

  </script>

</body>
</html>
